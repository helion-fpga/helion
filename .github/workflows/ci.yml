name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: workspace tests
        run: cargo test --workspace
        continue-on-error: true
      - name: counter gold
        run: cargo run -q -p helion-gui --bin helion-ide -- --headless examples/counter.sv
