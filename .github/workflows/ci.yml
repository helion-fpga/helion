name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      # Rune (vendored in third_party/rune) links libxkbcommon and
      # libwayland-client; helion-hw's native FTDI path links libusb.
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libusb-1.0-0-dev
      - name: lockfile is current
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: IDE and hardware tests
        run: cargo test --locked -p helion-rune --lib -p helion-hw
      - name: workspace tests
        run: cargo test --locked --workspace
        continue-on-error: true
      - name: counter gold
        run: |
          set -euo pipefail
          cargo run --locked -q -p helion-rune --bin helion-ide -- --headless examples/counter.sv | tee gold-ubuntu.log
          grep -F 'WNS_PS=9640' gold-ubuntu.log
      - name: release helion-ide
        run: cargo check --locked --release -p helion-rune --bin helion-ide

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: IDE and hardware tests
        run: cargo test --locked -p helion-rune -p helion-hw
      - name: workspace tests
        run: cargo test --locked --workspace
        continue-on-error: true
      - name: counter gold
        run: |
          set -euo pipefail
          cargo run --locked -q -p helion-rune --bin helion-ide -- --headless examples/counter.sv | tee gold.log
          grep -F 'WNS_PS=9640' gold.log
      - name: release helion-ide
        run: cargo check --locked --release -p helion-rune --bin helion-ide
