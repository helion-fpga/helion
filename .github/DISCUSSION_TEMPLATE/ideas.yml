title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Helion is original CAD: public vendor guides are a capability checklist, not source to copy.
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What you would like Helion to do, and why.
    validations:
      required: true
  - type: textarea
    id: engine
    attributes:
      label: Which part of Helion would own it
      placeholder: helion-sv / helion-sta / helion-rune (IDE) / helion-hw / docs / ...
