title: "[Q] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Questions about building, using or extending Helion. Bugs go to Issues.
  - type: textarea
    id: q
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: helion-ide --version, and your OS
  - type: textarea
    id: cmd
    attributes:
      label: What you already tried
      placeholder: Commands you ran and what they printed
      render: text
