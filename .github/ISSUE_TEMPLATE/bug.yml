name: Bug report
description: Something in Helion (CLI, IDE, engines, hardware) is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not attach vendor bitstreams, UNISIM netlists or encrypted vendor IP.
        Security issues go through [SECURITY.md](https://github.com/helion-fpga/helion/blob/master/SECURITY.md), not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - IDE (helion-ide)
        - CLI (helion)
        - Synthesis (SystemVerilog / VHDL / HLS)
        - Place and route
        - Timing, power, DRC
        - Simulation and waveforms
        - Hardware Manager and debug (JTAG, ILA, VIO)
        - Device families (HL10, iCE40, ECP5, 7-series)
        - Build, packaging, docs
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command, pane or test, and what it did.
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest design and the exact commands. Attach the design if you can.
      placeholder: |
        1. helion-ide examples/counter.prj
        2. Run Implementation
        3. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `helion-ide --version` (or `helion --version`), or the commit you built.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15 (Apple Silicon) / Ubuntu 24.04 x86_64 / ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt or `helion-ide --doctor` output
      render: text
  - type: dropdown
    id: gold
    attributes:
      label: Does `helion-ide --headless examples/counter.sv` still print WNS_PS=9640?
      options:
        - "Yes"
        - "No"
        - Did not run
