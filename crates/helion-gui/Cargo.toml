[package]
name = "helion-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["learner_l1_stage"]
# L1 stage/provenance adapters (always-on preference for this ship).
learner_l1_stage = []
# Soft diagnostic → RTL file:line (off until SV soft IR carries spans; never fake).
learner_l2_soft_span = []

[dependencies]
helion-proj = { workspace = true }
helion-device = { workspace = true }
helion-sv = { workspace = true }
helion-vhdl = { workspace = true }
helion-ir = { workspace = true }
helion-sta = { workspace = true }
helion-hw = { workspace = true }
helion-bits = { workspace = true }
helion-debug = { workspace = true }
helion-sim = { workspace = true }
helion-fabric = { workspace = true }
helion-drc = { workspace = true }
helion-bd = { workspace = true }
helion-ipxact = { workspace = true }
helion-place = { workspace = true }
helion-pack = { workspace = true }
helion-route = { workspace = true }
eframe = { version = "0.32.3", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rfd's Linux xdg-portal path pulls ashpd → zbus. Pinned in lockstep with
# the rune accesskit_unix floor (zbus ^5.19); workspace MSRV is 1.99.1.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"
zbus_macros = "=5.19.0"
zbus_names = "=4.3.5"
zvariant = "=5.15.1"
zvariant_derive = "=5.15.1"
zvariant_utils = "=4.2.0"
