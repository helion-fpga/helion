[package]
name = "helion-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
helion-proj = { workspace = true }
helion-device = { workspace = true }
helion-sv = { workspace = true }
helion-ir = { workspace = true }
helion-sta = { workspace = true }
helion-hw = { workspace = true }
helion-bits = { workspace = true }
helion-debug = { workspace = true }
helion-sim = { workspace = true }
helion-fabric = { workspace = true }
helion-drc = { workspace = true }
helion-bd = { workspace = true }
helion-ipxact = { workspace = true }
helion-place = { workspace = true }
eframe = { version = "0.32.3", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
rfd = "0.15"
# rfd's Linux xdg-portal path pulls ashpd → zbus. zbus ≥5.14 / zvariant ≥5.10
# need rustc 1.87; Helion CI and rust-version are 1.85.0. Pin the last 1.85
# MSRV line so Open HDL stays a native picker on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.13.2"
zbus_macros = "=5.13.2"
zbus_names = "=4.3.1"
zvariant = "=5.9.2"
zvariant_derive = "=5.9.2"
zvariant_utils = "=3.3.0"
